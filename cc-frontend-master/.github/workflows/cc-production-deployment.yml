name: s3 production-deployment

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: Node setup
        uses: actions/setup-node@v1
        with:
          node-version: 18

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install dependencies
        run: yarn install

      - name: Build go2ero
        run: yarn build:go2ero
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          CI: false

      - name: Copy go2ero files to s3 host
        run: aws s3 sync ./public/ ${{ secrets.S3_GO_ZERO_BUCKET }}

      - name: Invalidate cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_GO_ZERO_DIST_ID }} \
            --paths "/*"

      - name: Build carbo-calc
        run: yarn build:carbocalc
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          CI: false

      - name: Copy carbo-calc files to s3 host
        run: aws s3 sync ./public/ ${{ secrets.S3_CARBO_CALC_BUCKET }}

      - name: Invalidate cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_CARBO_CALC_DIST_ID }} \
            --paths "/*"
 