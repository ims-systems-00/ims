<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tender Autopilot</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header>
      <h1>Tender Autopilot</h1>
      <p>Draft from your private iMS library into the focused portal field.</p>
    </header>
    <div class="actions">
      <button type="button" id="draftBtn" class="primary">Draft focused field</button>
      <button type="button" id="optionsBtn" class="ghost">Options</button>
    </div>
    <p class="hint">Shortcut: <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd></p>
    <p id="status" class="status" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
