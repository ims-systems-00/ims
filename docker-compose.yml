# IMS Systems V5 — Docker Compose (local / production-like)
#
# Access the application at: http://localhost:7864
# Browser → frontend (Nginx) → backend → mongodb
#
# Backend and MongoDB stay on the internal Compose network (not published).

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ims_v5_mongodb_data:/data/db
    # No host port published — internal only
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: ims-systems-v5-backend/Dockerfile
    restart: unless-stopped
    environment:
      # development-stub remains the only security provider; NODE_ENV must
      # stay development until Auth0/OpenFGA adapters exist (see env guards).
      NODE_ENV: development
      PORT: "3001"
      MONGODB_URI: mongodb://mongodb:27017/ims_v5
      LOG_LEVEL: info
      SECURITY_PROVIDER: development-stub
      # OnlyOffice in-preview edit (D-27). Callback/file URLs must be
      # reachable from the onlyoffice container (use service DNS in Compose).
      ONLYOFFICE_ENABLED: ${ONLYOFFICE_ENABLED:-false}
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-http://localhost:8088}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-dev-onlyoffice-jwt-secret}
      ONLYOFFICE_CALLBACK_BASE_URL: ${ONLYOFFICE_CALLBACK_BASE_URL:-http://backend:3001/api/v1}
    depends_on:
      mongodb:
        condition: service_healthy
    # No host port published — reached via frontend Nginx /api/
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: ims-systems-v5-frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SECURITY_PROVIDER: development-stub
        VITE_ONLYOFFICE_URL: http://localhost:8088
    restart: unless-stopped
    ports:
      - "7864:80"
    depends_on:
      backend:
        condition: service_healthy

  # In-browser Office editing for Document Management (D-27).
  # Browser loads DocsAPI from localhost:8088; Document Server must reach
  # the API + file signed URLs via ONLYOFFICE_CALLBACK_BASE_URL /
  # FILES_LOCAL_PUBLIC_BASE_URL (host.docker.internal when API is on the host).
  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    ports:
      - "8088:80"
    extra_hosts:
      # Linux Docker: let Document Server reach the API on the host
      # (document download + editor-callback via host.docker.internal).
      - "host.docker.internal:host-gateway"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-dev-onlyoffice-jwt-secret}
      JWT_HEADER: Authorization
      JWT_IN_BODY: "true"
    volumes:
      - ims_v5_onlyoffice_data:/var/www/onlyoffice/Data

volumes:
  ims_v5_mongodb_data:
  ims_v5_onlyoffice_data:
