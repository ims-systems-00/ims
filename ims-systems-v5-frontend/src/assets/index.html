<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iMS OS animation pack - demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap">

<!-- 1. Animation styles -->
<link rel="stylesheet" href="../src/ims-intro.css">
<link rel="stylesheet" href="../src/ims-handoff.css">

<!-- 2. Head guard: must run before the page paints -->
<script src="../src/ims-intro-guard.js"></script>

<style>
  body{margin:0;min-height:100vh;background:#07091a;color:#eef0ff;font-family:Figtree,system-ui,sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 28px;border-bottom:1px solid #1c2050}
  header b{font-family:Poppins,sans-serif;font-size:20px}
  main{max-width:760px;margin:0 auto;padding:80px 24px;text-align:center}
  h1{font-family:Poppins,sans-serif;font-size:clamp(30px,5vw,48px);margin:0 0 16px}
  p{color:#a3a6d6;line-height:1.6}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:32px}
  .btn{font:600 15px Figtree,sans-serif;padding:14px 22px;border-radius:10px;text-decoration:none;color:#fff;background:#4f39f6;border:0;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid #343a7a}
</style>
</head>
<body>
<header><b>iMS OS</b><a class="btn" href="https://app.ims-os.com">Create your iMS</a></header>
<main>
  <h1>iMS OS animation pack</h1>
  <p>The intro plays once per browser tab. Any link to <code>https://app.ims-os.com</code> plays the hand-off animation before it opens the app.</p>
  <div class="row">
    <a class="btn" href="https://app.ims-os.com">Create your iMS (sign-up label)</a>
    <a class="btn ghost" href="https://app.ims-os.com/login">Log in (generic label)</a>
    <button class="btn ghost" type="button" onclick="try{sessionStorage.removeItem('imsIntro')}catch(e){};location.reload()">Replay intro</button>
  </div>
</main>

<!-- 3. Animation scripts, end of body -->
<script src="../src/ims-intro.js"></script>
<script src="../src/ims-handoff.js"></script>
</body>
</html>
