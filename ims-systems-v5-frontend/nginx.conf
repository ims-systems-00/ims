map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Prefer upstream X-Forwarded-* when the stack sits behind another proxy (TLS).
map $http_x_forwarded_proto $onlyoffice_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_x_forwarded_host $onlyoffice_host {
    default $http_x_forwarded_host;
    ''      $host;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed Vite assets — long cache, immutable
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Reverse-proxy V5 API to the backend Compose service
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-Id $http_x_correlation_id;

        # WebSocket upgrade support (future-ready)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # OnlyOffice Document Server — same-origin path so browsers never hit
    # localhost:8088 in production. DocsAPI loads from /onlyoffice/web-apps/...
    # X-Forwarded-Host includes the virtual path (OnlyOffice + Seafile pattern).
    location /onlyoffice/ {
        proxy_pass http://onlyoffice/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $onlyoffice_host/onlyoffice;
        proxy_set_header X-Forwarded-Proto $onlyoffice_scheme;
        proxy_set_header X-Forwarded-Prefix /onlyoffice;

        client_max_body_size 100m;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — do not cache index.html aggressively
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
